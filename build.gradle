plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'pl.tablet.cleanlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.tablet.cleanlauncher'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { compileOnly 'de.robv.android.xposed:api:82' }
